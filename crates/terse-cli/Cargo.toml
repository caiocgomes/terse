[package]
name = "terse-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line compiler for Terse, a small declarative document language that compiles to readable LaTeX"

[[bin]]
name = "terse"
path = "src/main.rs"

[dependencies]
terse-core = { path = "../terse-core" }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
filetime = "0.2"
